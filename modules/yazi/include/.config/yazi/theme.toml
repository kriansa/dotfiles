#:schema https://yazi-rs.github.io/schemas/theme.json

# Only overrides live here. Colours come from yazi's built-in theme-dark.toml or
# theme-light.toml, whichever matches the terminal background.

[indicator]
# Square off the hovered-row indicator instead of the default rounded caps.
padding = { open = "█", close = "█" }

[status]
# Drop the powerline arrows between status bar segments.
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }
