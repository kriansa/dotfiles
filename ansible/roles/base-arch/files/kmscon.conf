## All this options are overriden by the command line.
## So check your ksmcon launch script if an option has no visible effect
##
## For boolean options (like hwaccel), you can disable
## them by adding a "no-" prefix, like no-hwaccel or no-mouse

### General Options
#verbose
#debug

### Seat options (Usually setup in command line)
#vt=1
#switchvt
#libseat

### Session Options
#session-max=6
#session-control

### Graphics options
## Use drm driver (enabled by default)
#drm

## GPU to use, [all, primary, aux]
#gpus=all

## Enable 3d rendering, using gltex with drm3d instead of bbulk with drm2d
#hwaccel

## Use original mode (disabled by default)
#use-original-mode

## Force a specific mode for all monitors, widthxheight
#mode=1024x768
## Force a specific mode for a specific gpu/connector
#mode=pci-00d.00.0[HDMI-A-1]1920x1080@144
## You can find the gpu/connector name using journalctl -u kmsconvt@* | grep Display
## This parameter can be specified multiple times to set different modes for
## different gpus/connectors.

## Multi monitor configuration [clone, largest, scaled], default is scaled.
#multi-monitor=scaled

## Screen configuration, can be [normal, left, upside-down, right, disabled]
## Default all screens to rotate left
#screen=left
## Specific screen to be upside-down
#screen=pci-00d.00.0[HDMI-A-1]upside-down
## Disable HDMI-A-1
#screen=[HDMI-A-1]disabled

## Fonts
## font-engine, can be [freetype, pango, psf, unifont, 8x16], by default kmscon tries in this order.
#font-engine=freetype
## The font size is the height of the font in pixels. For psf, unifont and 8x16, only integer scaling is supported.
## The default value is 0, which will auto-detect the font size based on the monitor resolution.
#font-size=18
## font-name is only for freetype/pango. For psf, it's the path of the psf or psf.gz file. Unifont and 8x16 uses their own bitmap.
font-name=Iosevka Term

### Input Options ###
## Keyboard
#xkb-model=pc102
#xkb-layout=de
#xkb-variant=
#xkb-options=
#xkb-keymap=path/to/keymap.map
#xkb-compose-file=path/to/compose
xkb-repeat-delay=350
xkb-repeat-rate=25

## Keyboard Shortcuts
## Control keys are not case insensitive. Ex: <Ctrl>, <ctrl>, <CTRL>
## Other keys are case sensitive, and follow the keysym_names[] of the
## xkbcommon library.
## https://github.com/xkbcommon/libxkbcommon/blob/master/src/keysym-names.h
#grab-scroll-up=<Shift>Up
#grab-scroll-down=<Shift>Down
#grab-page-up=<Shift>Prior
#grab-page-down=<Shift>Next
#grab-zoom-in=<Ctrl>plus
#grab-zoom-out=<Ctrl>minus
#grab-session-next=<Ctrl><Logo>Right
#grab-session-prev=<Ctrl><Logo>Left
#grab-session-close=<Ctrl><Logo>BackSpace
#grab-terminal-new=<Ctrl><Logo>Return
#grab-rotate-cw=<Logo>plus
#grab-rotate-ccw=<Logo>minus
## Reboot system (disabled by default)
## Reboot behavior follows /proc/sys/kernel/ctrl-alt-del:
##   0 (default): graceful reboot (sends SIGINT to init)
##   >0: immediate hard reboot after syncing disk buffers
#grab-reboot=<Ctrl><Alt>Delete

## Enable mouse
#mouse
## Force software cursor
#soft-cursor

## Power Management
## Screen timeout in seconds (0 = disabled)
## The screen will be turned off (DPMS OFF) after this period of inactivity
## Any keyboard or mouse input will turn the screen back on
#dpms-timeout=600

## Terminal options
## Play an asciicast animation after opening the terminal session.
## The animation stops on keyboard input.
#asciicast=/usr/share/kmscon/login.cast

## Loop the asciicast animation.
#asciicast-loop

## value of the $TERM variable
#term=kmscon

## Reset environment [on]
#reset-env

## Send delete when backspace is pressed [on]
#backspace-delete

## Scrollback buffer size, in lines
#sb-size=10000

## Forward BEL (0x07) to the VT (default off)
#bell

## Blinking cursor and text with blink attribute (enabled by default)
#blink

## Colors palette, one of [solarized, solarized-black, solarized-white,
## soft-black, base16-dark, base16-light, vga, legacy, custom]
palette=custom

## If you selected palette=custom, you can customize each color with:
## One Light (base16), mirroring the ghostty theme in ~/.config/ghostty/config
palette-black=250,250,250
palette-red=202,18,67
palette-green=80,161,79
palette-yellow=193,132,1
palette-blue=64,120,242
palette-magenta=166,38,164
palette-cyan=1,132,188
palette-light-grey=56,58,66
palette-dark-grey=160,161,167
palette-light-red=202,18,67
palette-light-green=80,161,79
palette-light-yellow=193,132,1
palette-light-blue=64,120,242
palette-light-magenta=166,38,164
palette-light-cyan=1,132,188
palette-white=9,10,11
palette-foreground=56,58,66
palette-background=250,250,250
